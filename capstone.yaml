# FlyRank Capstone - Social Media Studio
# Phase 2: Ingestion & Generation Complete

name: flyrank-capstone-social-studio
version: 2.0.0
phase: 2

# Run commands
run:
  command: npm run dev
  env_file: .env

# Seed command
seed:
  command: npm run seed
  creates: constraint_profiles

# Base URL
base_url: http://localhost:3000

# Endpoints to probe
endpoints:
  health:
    path: /health
    method: GET
    expected_status: 200

  posts_create:
    path: /api/posts
    method: POST
    headers:
      Content-Type: application/json
    body:
      source_type: markdown
      title: "Test Post"
      body: "Test body content"
    expected_status: 201

  posts_list:
    path: /api/posts
    method: GET
    expected_status: 200

  posts_get:
    path: /api/posts/:id
    method: GET
    expected_status: 200

# Database
database:
  host: localhost
  port: 5433
  name: social_studio
  user: postgres
  password: postgres
  migrations:
    - src/db/migrations/001_create_posts.sql
    - src/db/migrations/002_create_constraint_profiles.sql
    - src/db/migrations/003_create_variants.sql
    - src/db/migrations/004_create_slots.sql
    - src/db/migrations/005_create_publish_attempts.sql

# Features
features:
  phase1:
    - Design document
    - Data model (5 tables)
    - Constraint profiles
  phase2:
    - Post ingestion endpoint
    - Variant generation (3 platforms)
    - Validation with named errors
    - Database migrations

# Status
status:
  phase1: complete
  phase2: complete
  phase3: not_started
  phase4: not_started
  phase5: not_started
